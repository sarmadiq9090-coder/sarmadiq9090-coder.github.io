# Every 6 hours: read the public CSV of the game-localization requests (answers of a Google Form owned by FastKiwi) and, if the list
# changed, commit data/game-requests.json straight to main (a data-only commit by the bot; no secrets, nothing else is touched).
# games/requests/ and ar/games/requests/ render that file. The CSV is read-only; requests are written by visitors directly to the form.
name: Sync game requests

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours, at :17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-requests
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the requests and rebuild data/game-requests.json
        run: node tools/sync-game-requests.mjs

      - name: Commit and push if the list changed
        run: |
          git add data/game-requests.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update game localization requests" -m "Automatic: data/game-requests.json rebuilt from the published responses sheet (tools/sync-game-requests.mjs)."
          git pull --rebase origin main
          git push origin HEAD:main
