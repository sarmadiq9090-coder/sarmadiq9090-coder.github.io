# Browser QA of the whole site (tests/qa.mjs, ~2000 checks) plus the tools' unit tests.
name: Site QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tools tests (feed, InstaWords fallback)
        run: npm run test:tools

      - name: Browser QA
        run: node tests/qa.mjs
        env:
          QA_OUT: tests/output

      - name: PDF Kit (tools/pdf, tools/)
        if: success() || failure()
        run: node tests/pdf-kit.mjs
        env:
          QA_OUT: tests/output

      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-qa-screenshots
          path: tests/output/
          retention-days: 14
