# Browser QA of the whole site (tests/qa.mjs, ~2000 checks) plus the tools' unit tests.
name: Site QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tools tests (feed, InstaWords fallback)
        run: npm run test:tools

      - name: Browser QA
        run: node tests/qa.mjs
        env:
          QA_OUT: tests/output

      - name: PDF Kit (tools/pdf, tools/)
        if: success() || failure()
        run: node tests/pdf-kit.mjs
        env:
          QA_OUT: tests/output

      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-qa-screenshots
          path: tests/output/
          retention-days: 14
