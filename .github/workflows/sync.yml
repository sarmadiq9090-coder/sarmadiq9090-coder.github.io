# Daily: rebuild instawords/ from the InstaWords repo, point the static InstaWords download at its latest installer,
# regenerate the release feeds (releases.xml, ar/releases.xml), run the QA suite, and, if something changed, open a pull
# request (never a direct push to main: GitHub safety rule 7, D-046). At most one open sync PR at a time.
# Also runs when the sync tools change on main (so the first feeds appear right after this workflow is merged).
name: Sync InstaWords and release feeds

on:
  schedule:
    - cron: '43 3 * * *' # daily 03:43 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/*.mjs' # the sync scripts only; the web tools (tools/pdf/, tools/vendor/...) don't need a sync
      - '.github/workflows/sync.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Check out InstaWords (formerly tafket)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: sarmadiq9090-coder/InstaWords
          path: .sync/tafket
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .sync/tafket/package-lock.json

      - name: Build the InstaWords site
        working-directory: .sync/tafket
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/update-release-fallback.mjs ]; then node scripts/update-release-fallback.mjs || true; fi
          npm ci
          npm run build:site
          test -f _site/index.html
          echo "TAFKET_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Replace instawords/ with the build
        run: rsync -a --delete --exclude .nojekyll .sync/tafket/_site/ instawords/

      - name: InstaWords fallback link + release feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-releases.mjs

      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: QA
        run: |
          npm run test:tools
          node tests/qa.mjs --no-shots
        env:
          QA_OUT: tests/output

      - name: Upload the QA report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-qa-report
          path: tests/output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit to a sync branch and open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A instawords releases.xml ar/releases.xml index.html ar/index.html releases ar/releases lemon ar/lemon site.js
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git diff --cached --stat
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'head:sync/' --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "A sync PR is already open; merge it first. Nothing pushed."; exit 0; fi
          branch="sync/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "Sync InstaWords site and release feeds" -m "From sarmadiq9090-coder/InstaWords@${TAFKET_SHA} and the GitHub releases of the four apps."
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Sync InstaWords site and release feeds" \
            --body "مزامنة يومية تلقائية لصفحات InstaWords وملفات «ما الجديد». Automatic daily sync; QA passed in the sync run. Merge when green (site publishes immediately, D-046)." \
            || echo "::warning::Could not open the PR (Settings → Actions → 'Allow GitHub Actions to create pull requests' may be off). Branch $branch was pushed; open the PR by hand."
